name: CI (Build & Test)

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'deploy/**'
      - 'go.mod'
      - 'go.sum'
      - 'build.sh'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Svelte 5 Frontend
        working-directory: ./web
        run: |
          bun install
          bun run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Go Vet & Unit Tests
        run: |
          go vet ./...
          go test -v ./...

      - name: Verify Android ARM64 Cross-Compilation
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build -ldflags="-s -w" -o bin/dsweb_arm64 ./cmd/dsweb
          ls -lh bin/dsweb_arm64
